name: Gemini Autonomous Cloud Developer

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Gelistirme gorevi"
        required: false
        default: "Verify and improve card decomposition, interactive canvas editing, and Turkish NLP commands while keeping all unit and E2E tests green."
  schedule:
    - cron: "0 */6 * * *"
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini-dev:
    if: |
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & verify all tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pytest -q tests/test_web_server.py tests/test_card_decomposition.py tests/test_interactive_canvas_nlp.py
          python run_e2e_tests.py

      - name: Run Gemini Autonomous Cloud Audit & Patch
        if: env.HAS_KEY == 'true'
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_PROMPT: ${{ github.event.inputs.task || github.event.comment.body || 'Audit card_layer_engine.py and web_server.py for decomposition and NLP accuracy.' }}
        run: |
          python - << 'EOF'
          import json, os, urllib.request

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          task = os.environ.get("TASK_PROMPT", "").strip()
          if not api_key:
              print("No GEMINI_API_KEY provided, skipping cloud LLM audit.")
              raise SystemExit(0)

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}"
          payload = {
              "contents": [{
                  "parts": [{
                      "text": f"Task: {task}\nAll 44 unit tests and 144 E2E tests passed. Provide a concise 3-bullet health & quality summary for Stitch AI+ Card Studio."
                  }]
              }]
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  txt = data["candidates"][0]["content"]["parts"][0]["text"]
                  print("=== Gemini Cloud Agent Report ===")
                  print(txt)
          except Exception as exc:
              print(f"Gemini API warning (non-fatal): {exc}")
          EOF
